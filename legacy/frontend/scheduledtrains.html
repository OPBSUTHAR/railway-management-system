        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            display: none;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.5s, transform 0.3s ease-in-out;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr {
            transition: background-color 0.3s, transform 0.2s;
        }
        tr:hover {
            background-color: #f1f1f1;
            transform: scale(1.02);
        }

            background-color: #333;
            padding: 10px 0;

            text-decoration: none;
            font-size: 18px;
            color: white;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #007bff;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        input {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            outline: none;
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        function searchTrain() {
    let trainNum = document.getElementById("trainNumber").value.trim();
    let table = document.getElementById("scheduleTable");
    let tbody = document.getElementById("scheduleBody");
    let inputField = document.getElementById("trainNumber");

    tbody.innerHTML = ""; // Clear previous results

    if (!trainNum) {
        alert("Please enter a train number.");
        table.style.display = "none";
        return;
    }

    if (trainData.hasOwnProperty(trainNum)) { // Check if train exists in data
        trainData[trainNum].forEach(station => {
            let row = `<tr>
                <td>${station.code}</td>
                <td>${station.name}</td>
                <td>${station.arrival}</td>
                <td>${station.departure}</td>
                <td>${station.halt}</td>
                <td>${station.distance}</td>
                <td>${station.day}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
        table.style.display = "table";
        table.style.opacity = "1";
        table.style.transform = "scale(1)";
    } else {
        inputField.classList.add("shake");
        inputField.style.borderColor = "red";
        setTimeout(() => {
            inputField.classList.remove("shake");
            inputField.style.borderColor = "#ccc";
        }, 600);
        alert("Train number not found!");
        table.style.display = "none";
    }
}
