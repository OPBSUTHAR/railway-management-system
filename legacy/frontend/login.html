<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <script>
        async function handleLogin(event) {
            event.preventDefault(); // Prevent form submission

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("http://localhost:3000/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert("Login successful!");
                localStorage.setItem("user", JSON.stringify({ username })); // Store user session
                window.location.href = "index.html"; // Redirect to home page
            } else {
                alert(data.error);
                if (data.error === "User not found. Please register!") {
                    window.location.href = "signup.html"; // Redirect to signup page
                }
            }
        }

        function checkLoginStatus() {
            const user = localStorage.getItem("user");
            if (user) {
                document.getElementById("login-btn").textContent = "Logout";
                document.getElementById("login-btn").onclick = handleLogout;
            }
        }

        function handleLogout() {
            localStorage.removeItem("user"); // Clear session
            alert("Logged out successfully!");
            window.location.href = "login.html"; // Redirect to login page
        }

        window.onload = checkLoginStatus;
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Welcome Back</h1>
            <p>Log in to access your dashboard</p>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="username" name="username" required />
                    <label for="username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" required />
                    <label for="password">Password</label>
                </div>
                <button type="submit" id="login-btn" class="login-btn">Log In</button>
            </form>
            <div class="links">
                <a href="#">Forgot Password?</a> |
                <a href="signup.html">Create Account</a>
            </div>
        </div>
    </div>
</body>
</html>
